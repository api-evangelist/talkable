      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site_slug:
                  $ref: ../schemas.yaml#/site_slug
                data:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: affiliate@store.com
                    first_name:
                      type: string
                      example: John
                    last_name:
                      type: string
                      example: Doe
                    username:
                      type: string
                      example: johndoe1992
                    customer_id:
                      type: string
                      example: '1024'
                    custom_properties:
                      $ref: ../schemas.yaml#/custom_properties
                    phone_number:
                      $ref: ../schemas.yaml#/phone_number
                    campaign_tags:
                      type: string
                      example: invite
                    sharing_channels:
                      type: array
                      items:
                        type: string
                      example:
                      - facebook
                      - custom
                      description: Used to generate unique Friend Claim Page links
                    ip_address:
                      $ref: ../schemas.yaml#/ip_address
                    uuid:
                      $ref: '#/components/schemas/visitor_uuid'
                    created_at:
                      $ref: ../schemas.yaml#/date_time
                    traffic_source:
                      type: string
                      example: article-1
                    segment1:
                      type: string
                      example: CA
                    segment2:
                      type: string
                      example: male
                    segment3:
                      type: string
                      example: article-1
                    utm_source:
                      type: string
                      example: facebook
                    utm_medium:
                      type: string
                      example: example_medium
                    utm_campaign:
                      type: string
                      example: example_campaign
                    utm_term:
                      type: string
                      example: example_term
                    utm_content:
                      type: string
                      example: example_content
                  required:
                  - email
              required:
              - site_slug
              - data
