              examples:
                origin marked as fully refunded:
                  value:
                    ok: true
                    result:
                      origin:
                        subtotal: 100.44
                        customer_id: null
                        email: customer@example.com
                        id: 1
                        ip_address: 1.2.3.4
                        order_number: B00K2EOONI
                        refunded_at: '2026-07-07T11:07:44.000-07:00'
