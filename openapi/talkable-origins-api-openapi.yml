                        partially_refunded: false
                        refund_subtotal: 100.44
                        coupon_code: ''
                origin marked as partially refunded:
                  value:
                    ok: true
                    result:
                      origin:
                        subtotal: 100.44
                        customer_id: null
                        email: customer@example.com
                        id: 1
                        ip_address: 1.2.3.4
