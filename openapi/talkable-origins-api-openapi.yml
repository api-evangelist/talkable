openapi: 3.0.3
info:
  title: Talkable Advocate Offers Origins API
  version: '2.0'
  contact:
    name: API Reference
    url: https://docs.talkable.com/api_v2/
servers:
- url: https://www.talkable.com
security:
- api_key: []
tags:
- name: Origins
paths:
  /api/v2/origins:
    post:
      summary: Create an origin
      tags:
      - Origins
      parameters: []
      operationId: createOrigin
      responses:
        '201':
          description: purchase created
          content:
            application/json:
              example:
                ok: true
                result:
                  origin:
                    subtotal: 100.44
                    customer_id: '1024'
                    email: customer@store.com
                    id: 1
                    ip_address: 192.0.2.255
                    order_number: '20'
                    refunded_at: null
                    type: Purchase
                    segment1: null
                    segment2: null
                    segment3: null
                    utm_campaign: null
                    utm_content: null
                    utm_medium: null
                    utm_source: null
                    utm_term: null
                    order_date: '2026-07-07T11:06:14.000-07:00'
                    partially_refunded: false
                    refund_subtotal: null
                    coupon_code: C0001,C0002
                  offer:
                    claim_url: https://share.my-store.com/x/BCR7w2
                    email: customer@store.com
                    id: 1
                    short_url_code: gWQ3y4
                    show_url: https://share.my-store.com/x/52Ea09
                    coupon_code: null
                    incentives: {}
                    trigger_widget: false
                    campaign_tags:
                    - post-purchase
        '400':
          description: wrong type
          content:
            application/json:
              example:
                ok: false
                error_message: '`type` must be within ["AffiliateMember", "Purchase", "Event"]'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site_slug:
                  $ref: ../schemas.yaml#/site_slug
                type:
                  type: string
                  enum:
                  - AffiliateMember
                  - Purchase
                  - Event
                  example: Purchase
                data:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: customer@store.com
                    order_number:
                      type: string
                      example: '20'
                    subtotal:
                      type: number
                      format: float
                      example: 100.44
                    first_name:
                      type: string
                      example: John
                    last_name:
                      type: string
                      example: Doe
                    username:
                      type: string
                      example: johndoe1992
                    customer_id:
                      type: string
                      example: '1024'
                    custom_properties:
                      $ref: ../schemas.yaml#/custom_properties
                    phone_number:
                      $ref: ../schemas.yaml#/phone_number
                    campaign_tags:
                      type: string
                      example: post-purchase
                    sharing_channels:
                      type: array
                      items:
                        type: string
                      example:
                      - facebook
                      - custom
                      description: Used to generate unique Friend Claim Page links
                    ip_address:
                      $ref: ../schemas.yaml#/ip_address
                    uuid:
                      $ref: '#/components/schemas/visitor_uuid'
                    created_at:
                      $ref: ../schemas.yaml#/date_time
                    traffic_source:
                      type: string
                      example: in-store
                    segment1:
                      type: string
                      example: CA
                    segment2:
                      type: string
                      example: male
                    segment3:
                      type: string
                      example: in-store
                    utm_source:
                      type: string
                      example: facebook
                    utm_medium:
                      type: string
                      example: example_medium
                    utm_campaign:
                      type: string
                      example: example_campaign
                    utm_term:
                      type: string
                      example: example_term
                    utm_content:
                      type: string
                      example: example_content
                    coupon_codes:
                      $ref: '#/components/schemas/coupon_codes'
                    currency_iso_code:
                      $ref: '#/components/schemas/currency_code'
                    shipping_address:
                      type: string
                      example: 456 White Finch St., North Augusta, South Carolina, 29860, United States
                      description: Full address of the order, make sure to strictly follow a format
                    shipping_zip:
                      type: string
                      example: '29860'
                      description: Used for fraud protection by address
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          price:
                            type: number
                            format: float
                            example: 25.11
                          quantity:
                            type: integer
                            example: 4
                          product_id:
                            type: string
                            example: TSHIRT
                  required:
                  - email
                  - order_number
                  - subtotal
              required:
              - site_slug
              - type
              - data
  /api/v2/origins/affiliate_member:
