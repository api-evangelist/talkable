          content:
            application/json:
              examples:
                member not found:
                  value:
                    ok: false
                    error_message: Loyalty member not found
                member is not active:
                  value:
                    ok: false
                    error_message: Loyalty member is not active
                campaign not found:
                  value:
                    ok: false
                    error_message: No loyalty campaign found for the member
  "/api/v2/metrics/{metric}":
    get:
      summary: Calculate a metric
      tags:
      - Metrics
      parameters:
      - name: metric
        in: path
        schema:
          type: string
          example: sharing_rate
        required: true
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      - name: start_date
        in: query
        schema:
          type: string
          format: date
          example: 1/15/2024
        required: true
      - name: end_date
        in: query
        schema:
          type: string
          format: date
          example: 2/15/2024
        required: true
      - name: sharing_channels[]
        collectionFormat: multi
        in: query
        schema:
          type: array
          items:
            type: string
        example:
        - email
      - name: traffic_sources[]
        collectionFormat: multi
        in: query
        schema:
          type: array
          items:
            type: string
      - name: campaign_ids[]
        collectionFormat: multi
        in: query
        schema:
          type: array
          items:
            type: integer
        example:
        - 42
      - name: campaign_tags[]
        collectionFormat: multi
        in: query
        schema:
          type: array
          items:
            type: string
        example:
        - default
      - name: campaign_status
        in: query
        schema:
          type: string
          example: Live
      - name: mobile_visitor
        in: query
        schema:
          type: boolean
          example: true
        required: false
      - name: device_type
        in: query
        schema:
          type: string
          example: mobile
      - name: precision
        in: query
        schema:
          type: integer
          example: 0
      - name: live_campaigns_only
        in: query
        schema:
          type: boolean
          example: true
      - name: exclude_qa_generated
        in: query
        schema:
          type: boolean
          example: false
          default: true
      operationId: calculateMetric
      responses:
        '200':
          description: metric info
          content:
            application/json:
              example:
                ok: true
                result:
                  plain: 2
                  formatted: '2'
                  result_type: number
        '400':
          description: returns an error when invalid metric passed
          content:
            application/json:
              example:
                ok: false
                error_message: No metric found.
  "/api/v2/metrics/{metric}/segmentize":
    get:
      summary: Calculate a metric with all segmented information
      tags:
      - Metrics
      parameters:
      - name: metric
        in: path
        schema:
          type: string
          example: sharing_rate
        required: true
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      - name: start_date
        in: query
        schema:
          type: string
          format: date
          example: 1/15/2024
        required: true
      - name: end_date
        in: query
        schema:
          type: string
          format: date
          example: 2/15/2024
        required: true
      - name: sharing_channels[]
        collectionFormat: multi
        in: query
        schema:
          type: array
          items:
            type: string
        example:
        - email
      - name: traffic_sources[]
        collectionFormat: multi
        in: query
        schema:
          type: array
          items:
            type: string
      - name: campaign_ids[]
        collectionFormat: multi
        in: query
        schema:
          type: array
          items:
            type: integer
        example:
        - 42
      - name: campaign_tags[]
        collectionFormat: multi
        in: query
        schema:
          type: array
          items:
            type: string
        example:
        - default
      - name: campaign_status
        in: query
        schema:
          type: string
          example: Live
      - name: mobile_visitor
        in: query
        schema:
          type: boolean
          example: true
        required: false
      - name: device_type
        in: query
        schema:
          type: string
          example: mobile
      - name: precision
        in: query
        schema:
          type: integer
          example: 0
      - name: live_campaigns_only
        in: query
        schema:
          type: boolean
          example: true
      - name: exclude_qa_generated
        in: query
        schema:
          type: boolean
          example: false
          default: true
      - name: segment_by[period]
        in: query
        schema:
          type: string
          example: week
      - name: segment_by[campaign_tags]
        in: query
        schema:
          type: array
        required: false
      - name: segment_by[sharing_channels]
        in: query
        schema:
          type: boolean
        required: false
      - name: segment_by[campaign_types]
        in: query
        schema:
          type: boolean
        required: false
      description: Returns a metric value which includes plain value, formatted value,
        result’s type and all segmented information
      operationId: calculateMetricWithAllSegmentedInformation
      responses:
        '200':
          description: metric segmented
          content:
            application/json:
              example:
                ok: true
                result:
                  segmented:
                  - plain: 0
                    formatted: '0'
                    result_type: number
                    period: 6/7/26 - 6/30/26
                  - plain: 3
                    formatted: '3'
                    result_type: number
                    period: 7/1/26 - 7/7/26
        '400':
          description: returns an error when invalid segment_by
          content:
            application/json:
              example:
                ok: false
                error_message: 'Unsupported option for period segmentation. Supported
                  options: day, week, month, quarter, year'
  "/api/v2/offer_claims":
    post:
      summary: Share and claim an offer
      tags:
      - Offer Claims
      - Rewards
      - Shares
      parameters:
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      - name: advocate_email
        in: query
        schema:
          type: string
          format: email
          example: advocate@example.com
        required: true
      - name: friend_email
        in: query
        schema:
          type: string
          format: email
          example: friend@example.com
        required: true
      operationId: shareAndClaimOffer
      responses:
        '200':
          description:
          content:
            application/json:
              examples:
                friend rewarded:
                  value:
                    ok: true
                    result:
                      friend_reward:
                        amount: 10.0
                        id: 1
                        reason: click
                        status: Paid
                        coupon:
                          amount: 10.0
                          description: "$10"
                          code: COUPON_CODE_29
                          expires_at:
                          id: 1
                          percentage_discount: false
                          single_use: true
                          used: false
                          active: true
                          usages: 0
                          valid_until:
                        coupon_code: COUPON_CODE_29
                        incentive_type: discount_coupon
                        incentive_description: single use coupon for $10 off
                        incentive_custom_description:
                      friend_unredeem_reason:
                      friend_human_unredeem_reason:
                friend not rewarded:
                  value:
