---
openapi: 3.0.3
paths:
  "/api/v2/assets":
    get:
      summary: List assets
      tags:
      - Assets
      parameters:
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      - name: content_type
        in: query
        required: false
        description: Filter by content type or its prefix, e.g. `image` or `image/png`.
        schema:
          type: string
          example: image
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      operationId: listAssets
      responses:
        '200':
          description: assets list
          content:
            application/json:
              example:
                ok: true
                result:
                  assets:
                  - content_type: video/mp4
                    id: 3
                    name: frog_video_short.mp4
                    url: https://d2jjzw81hqbuqv.cloudfront.net/static_assets/files/3/original/frog_video_short.mp4
                    size: 281524
                    width:
                    height:
                    fingerprint: f773c1d7bd57e3549a8cd2516fdbdd4e
                    created_at: '2026-07-07T11:04:57.000-07:00'
                    updated_at: '2026-07-07T11:04:57.000-07:00'
                  - content_type: image/png
                    id: 2
                    name: closebutton.png
                    url: https://d2jjzw81hqbuqv.cloudfront.net/static_assets/files/2/original/closebutton.png
                    size: 6600
                    width: 100
                    height: 100
                    fingerprint: 0c406c68a263801c7ce983efda254268
                    created_at: '2026-07-07T11:04:57.000-07:00'
                    updated_at: '2026-07-07T11:04:57.000-07:00'
                  - content_type: image/jpeg
                    id: 1
                    name: santa.jpg
                    url: https://d2jjzw81hqbuqv.cloudfront.net/static_assets/files/1/original/santa.jpg
                    size: 121059
                    width: 960
                    height: 900
                    fingerprint: df262c29b6ab5f5a97b6870c3c9ba813
                    created_at: '2026-07-07T11:04:57.000-07:00'
                    updated_at: '2026-07-07T11:04:57.000-07:00'
                  total: 3
    post:
      summary: Upload an asset
      tags:
      - Assets
      parameters:
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      operationId: uploadAsset
      responses:
        '201':
          description: asset uploaded
          content:
            application/json:
              example:
                ok: true
                result:
                  asset:
                    content_type: image/jpeg
                    id: 1
                    name: santa.jpg
                    url: https://d2jjzw81hqbuqv.cloudfront.net/static_assets/files/1/original/santa.jpg
                    size: 121059
                    width: 960
                    height: 900
                    fingerprint: df262c29b6ab5f5a97b6870c3c9ba813
                    created_at: '2026-07-07T11:05:03.000-07:00'
                    updated_at: '2026-07-07T11:05:03.000-07:00'
        '422':
          description: asset with the same name already exists
          content:
            application/json:
              example:
                ok: false
                error_message: 'Validation failed: File name has already been taken'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Asset file. The asset name is derived from the uploaded
                    file name. Fails if an asset with the same name already exists
                    on the account.
              required:
              - file
        required: true
  "/api/v2/assets/{id}":
    get:
      summary: Find an asset
      tags:
      - Assets
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      operationId: findAsset
      responses:
        '200':
          description: asset found
          content:
            application/json:
              example:
                ok: true
                result:
                  asset:
                    content_type: image/jpeg
                    id: 1
                    name: santa.jpg
                    url: https://d2jjzw81hqbuqv.cloudfront.net/static_assets/files/1/original/santa.jpg
                    size: 121059
                    width: 960
                    height: 900
                    fingerprint: df262c29b6ab5f5a97b6870c3c9ba813
                    created_at: '2026-07-07T11:05:10.000-07:00'
                    updated_at: '2026-07-07T11:05:10.000-07:00'
        '400':
          description: asset not found
          content:
            application/json:
              example:
                ok: false
                error_message: No asset found by `id`.
  "/api/v2/campaigns":
    get:
      summary: List campaigns
      tags:
      - Campaigns
      parameters:
      - "$ref": "#/components/parameters/site_slug_in_query_required"
        name: site_slug
        in: query
        schema:
          type: string
      operationId: listCampaigns
      responses:
        '200':
          description: returns the list of campaigns
          content:
            application/json:
              example:
                ok: true
                result:
                  campaigns:
                  - slug: 2
                    is_active: false
                    appearance: popup
                    id: 2
                    joinable_category_names:
                    - purchase
                    name: Deal for friends
                    origin_max_age:
                    origin_min_age:
                    status: Disabled
                    tag_names: []
                    live_period:
                      starts_at: '2026-07-07T11:05:00.000-07:00'
                      ends_at: '2026-07-07T11:05:00.000-07:00'
                  - slug: 1
                    is_active: true
                    appearance: inline
                    id: 1
                    joinable_category_names:
                    - affiliate_member
                    name: Deal for friends
                    origin_max_age:
                    origin_min_age:
                    status: Live
                    tag_names: []
                    live_period:
                      starts_at: '2026-07-07T11:05:00.000-07:00'
                      ends_at:
  "/api/v2/coupons/{code}":
    get:
      summary: Find a coupon
      description: Returns a coupon.
      tags:
      - Coupons
      parameters:
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      - name: code
        in: path
        schema:
          type: string
        required: true
      operationId: findCoupon
      responses:
        '200':
          description: coupon found
          content:
            application/json:
              example:
                ok: true
                result:
                  talkable_coupon: true
                  coupon:
                    amount: 10.0
                    description: 10%
                    code: COUPON_CODE_1
                    expires_at:
                    id: 1
                    percentage_discount: true
                    single_use: true
                    used: false
                    active: true
                    usages: 0
                    valid_until:
                  associated_reward:
  "/api/v2/coupons/{code}/permission/{person_slug}":
    get:
      summary: Check if given coupon code belongs to given person
      tags:
      - Coupons
      - People
      parameters:
      - name: code
        in: path
        schema:
          type: string
        required: true
      - "$ref": "#/components/parameters/person_slug_in_path"
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      operationId: checkIfGivenCouponCodeBelongsToGivenPerson
      responses:
        '200':
          description: returns result of check
          content:
            application/json:
              example:
                ok: true
                result:
                  talkable_coupon: true
                  coupon:
                    amount: 10.0
                    description: 10%
                    code: COUPON_CODE_7
                    expires_at:
                    id: 1
                    percentage_discount: true
                    single_use: true
                    used: false
                    active: true
                    usages: 0
                    valid_until:
                  associated_reward:
                  allowed: false
                  error_message: This coupon code has not been issued yet
                  checks:
                    coupon_unissued: true
                    coupon_expired: false
                    friend_offer_expired: false
                    different_owner: false
                    coupon_used: false
  "/api/v2/loyalty/members/{email}/collect_actions":
    get:
      summary: List collect actions
      tags:
      - Loyalty
      parameters:
      - name: email
        in: path
        schema:
          "$ref": "#/components/schemas/member_email"
        required: true
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      operationId: listCollectActions
      responses:
        '200':
          description: returns collect actions
          content:
            application/json:
              example:
                ok: true
                result:
                  actions:
                  - type: dummy
                    created_at: '2026-07-07T11:05:31.000-07:00'
                    points: 21
                    action_config:
                      name: Name
                      description: description
                      points: 21
                    coupon:
                    event:
                    user:
        '400':
          description:
          content:
            application/json:
              examples:
                member not found:
                  value:
                    ok: false
                    error_message: Loyalty member not found
                member is not active:
                  value:
                    ok: false
                    error_message: Loyalty member is not active
                campaign not found:
                  value:
                    ok: false
                    error_message: No loyalty campaign found for the member
    post:
      summary: Create a collect action
      tags:
      - Loyalty
      parameters:
      - name: email
        in: path
        schema:
          "$ref": "#/components/schemas/member_email"
        required: true
      operationId: createCollectAction
      responses:
        '200':
          description:
          content:
            application/json:
              examples:
                creates collect action:
                  value:
                    ok: true
                    result:
                      collected: true
                      loyalty_member:
                        custom_properties: {}
                        email: test+11@example.com
                        phone_number:
                        points_balance: 121
                        member_dates: []
                no action configs matched:
                  value:
                    ok: true
                    result:
                      collected: false
                      loyalty_member:
                        custom_properties: {}
                        email: test+12@example.com
                        phone_number:
                        points_balance: 100
                        member_dates: []
        '400':
          description:
          content:
            application/json:
              examples:
                no action configs found by type:
                  value:
                    ok: false
                    error_message: No action configurations found for identifier `random`
                member not found:
                  value:
                    ok: false
                    error_message: Loyalty member not found
                member is not active:
                  value:
                    ok: false
                    error_message: Loyalty member is not active
                campaign not found:
                  value:
                    ok: false
                    error_message: No loyalty campaign found for the member
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site_slug:
                  "$ref": "../schemas.yaml#/site_slug"
                data:
                  type: object
                  properties:
                    type:
                      type: string
                    traffic_source:
                      type: string
                      default: api
                  required:
                  - type
              required:
              - site_slug
              - data
  "/api/v2/loyalty/members/{email}/manual_adjustment_actions":
    parameters:
    - name: email
      in: path
      schema:
        "$ref": "#/components/schemas/member_email"
      required: true
    get:
      summary: List manual adjustment actions
      tags:
      - Loyalty
      parameters:
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      operationId: listManualAdjustmentActions
      responses:
        '200':
          description: returns manual adjustment actions
          content:
            application/json:
              example:
                ok: true
                result:
                  actions:
                  - type: manual_adjustment
                    created_at: '2026-07-07T11:05:37.000-07:00'
                    points: -100
                    action_config:
                    coupon:
                    event:
                    user:
                      account_id: 1
                      email: aa81@gg.com
                      id: 1
                      staff_member: false
        '400':
          description: member not found
          content:
            application/json:
              example:
                ok: false
                error_message: Loyalty member not found
    post:
      summary: Adjust loyalty member’s points balance
      description: |
        Adjusts loyalty member’s points balance.

        Accepts ``data`` JSON object with ``points`` property and optional ``description``.

        E.g. ``{"points": 100}`` or ``{"points": -100, "description": "For cheating"}``.
      tags:
      - Loyalty
      parameters: []
      operationId: adjustLoyaltyMembersPointsBalance
      responses:
        '200':
          description: balance updated
          content:
            application/json:
              example:
                ok: true
                result:
                  action:
                    type: manual_adjustment
                    created_at: '2026-07-07T11:05:39.000-07:00'
                    points: -100
                    action_config:
                    coupon:
                    event:
                    user:
                      account_id: 2
                      email: api@talkable.com
                      id: 1
                      staff_member: false
                  loyalty_member:
                    custom_properties: {}
                    email: test+20@example.com
                    phone_number:
                    points_balance: 0
                    member_dates: []
        '422':
          description: balance not updated
          content:
            application/json:
              example:
                ok: false
                error_message: 'Validation failed: Points adjustment must result in
                  member points balance between 0 and available points limit'
        '400':
          description: member not found
          content:
            application/json:
              example:
                ok: false
                error_message: Loyalty member not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site_slug:
                  "$ref": "../schemas.yaml#/site_slug"
                data:
                  type: object
                  properties:
                    points:
                      type: integer
                      description: Amount of points to add or subtract.
                      example: -100
                    description:
                      type: string
                      description: A contextual explanation why points amount was
                        adjusted.
                      example: For cheating
                  required:
                  - points
              required:
              - site_slug
              - data
  "/api/v2/loyalty/members/{email}":
    parameters:
    - name: email
      in: path
      schema:
        "$ref": "#/components/schemas/member_email"
      required: true
    get:
      summary: Find a loyalty member
      tags:
      - Loyalty
      parameters:
      - "$ref": "#/components/parameters/site_slug_in_query_required"
      operationId: findLoyaltyMember
      responses:
        '200':
          description: member found
          content:
            application/json:
              example:
                ok: true
                result:
                  loyalty_member:
                    custom_properties: {}
                    email: test+23@example.com
                    phone_number:
                    points_balance: 100
                    member_dates: []
        '400':
          description:
          content:
            application/json:
              examples:
                member not found:
                  value:
                    ok: false
                    error_message: Loyalty member not found
                member is not active:
                  value:
                    ok: false
                    error_message: Loyalty member is not active
    put:
      summary: Update a loyalty member
      description: |
        Updates loyalty member data.

        Accepts ``data`` JSON object with ``custom_properties`` and ``member_dates`` JSON objects.

        E.g. ``{"custom_properties":{"contest_participant":true},"member_dates":{"identifier":"birthday","date":"2004-01-01"}}``.

        Note that all values in ``custom_properties`` object will be stored as strings,
        e.g. ``false`` will become ``"f"``, and ``123`` will become ``"123"``.
      tags:
      - Loyalty
      parameters: []
      operationId: updateLoyaltyMember
      responses:
        '200':
          description: updates member
          content:
            application/json:
              example:
                ok: true
                result:
                  loyalty_member:
                    custom_properties:
                      subscribed_at: '2024-01-01'
                    email: test+25@example.com
                    phone_number:
                    points_balance: 100
                    member_dates:
                    - date: '2004-01-01'
                      identifier: birthday
        '400':
          description: invalid member_dates
          content:
            application/json:
              example:
                ok: false
                error_message: Invalid member_dates format, expected an array of objects
                  with `date` and `identifier` keys
        '422':
          description: invalid custom property key
          content:
            application/json:
              example:
                ok: false
                error_message: 'Validation failed: Identifier can contain lowercase
                  letters, numbers and ''_'' only and cannot begin with a number'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site_slug:
                  "$ref": "../schemas.yaml#/site_slug"
                data:
                  type: object
                  properties:
                    custom_properties:
                      "$ref": "../schemas.yaml#/custom_properties"
                    member_dates:
                      type: array
                      description: Array of member dates, each with `identifier` and
                        `date` fields.
                      items:
                        type: object
                        properties:
                          identifier:
                            type: string
                            example: birthday
                            description: Identifier of the member date, created in
                              rule configuration.
                          date:
                            type: string
                            format: date
                            example: '2004-01-01'
                        required:
                        - identifier
                        - date
              required:
              - site_slug
              - data
  "/api/v2/loyalty/members/{email}/redeem_actions":
    parameters:
    - name: email
      in: path
      schema:
        "$ref": "#/components/schemas/member_email"
