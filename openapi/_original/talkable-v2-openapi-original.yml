              example:
                ok: false
                error_message: No site found by `site_slug`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site_slug:
                  "$ref": "../schemas.yaml#/site_slug"
                data:
                  type: object
                  properties:
                    uuid:
                      "$ref": "#/components/schemas/visitor_uuid"
                  required:
                  - uuid
              required:
              - site_slug
              - data
