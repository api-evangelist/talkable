                      single_use: true
                      used: false
                      active: true
                      usages: 0
                      valid_until:
                    event:
                    user:
                  loyalty_member:
                    custom_properties: {}
                    email: test+35@example.com
                    phone_number:
                    points_balance: 90
                    member_dates: []
