                  actions:
                  - type: redeem
                    created_at: '2026-07-07T11:05:46.000-07:00'
                    points: -100
                    action_config:
                    coupon:
                      amount: 10.0
                      description: 10%
                      code: COUPON_CODE_18
                      expires_at:
                      id: 1
                      percentage_discount: true
                      single_use: true
                      used: false
                      active: true
                      usages: 0
                      valid_until:
                    event:
                    user:
        '400':
          description:
          content:
            application/json:
              examples:
                member not found:
                  value:
                    ok: false
                    error_message: Loyalty member not found
                member is not active:
                  value:
                    ok: false
                    error_message: Loyalty member is not active
