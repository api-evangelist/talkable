          description: member has not enough points
          content:
            application/json:
              example:
                ok: false
                error_message: not enough points
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site_slug:
                  "$ref": "../schemas.yaml#/site_slug"
                data:
                  type: object
                  properties:
                    redemption_batch_id:
                      type: integer
                      format: int32
                      minimum: 1
                      example: 1
                    traffic_source:
                      type: string
                      default: api
                  required:
                  - redemption_batch_id
              required:
              - site_slug
              - data
  "/api/v2/loyalty/members/{email}/redemption_batches":
    get:
      summary: List redemption batches
