---
openapi: 3.0.3
paths:
  "/your_api_check_unsubscribe_web_hook_path":
    post:
      summary: Check Unsubscribe
      tags:
      - Check Unsubscribe
      parameters: []
      operationId: check_unsubscribe
      responses:
        '200':
          description: Talkable considers a Webhook as "delivered successfully" when
            a site server returns a 2xx response status. Otherwise Talkable will continually
            retry to deliver a Webhook after a set interval of time.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Talkable security key
                site:
                  "$ref": "../schemas.yaml#/site_slug"
                type:
                  type: string
                  example: check_unsubscribe_web_hook
                extras:
                  type: object
                  example: {}
                payload:
                  type: object
                  properties:
                    campaign:
                      "$ref": "#components/schemas/campaign"
                    recipient:
                      "$ref": "#components/schemas/person"
                    email_type:
                      type: string
                      enum:
                      - notifier_offers_email
                      - notifier_offers_share_via_email
                      - notifier_offers_share_via_email_reminder
                      - advocate_rewards_confirmation
                      - advocate_rewards_paid
                      - friend_rewards_paid
                      - custom_share_page_email
                      - custom_claim_page_email
                      - wallet_welcome_email
                      - email_capture_reward_reminder
                      - loyalty_post_action_email
                      - loyalty_tier_upgraded_email
                      - loyalty_tier_downgraded_email
                      - loyalty_points_expiring_soon_email
                      example: notifier_offers_email
                      description: Described view category
  "/your_api_claim_signup_web_hook_path":
    post:
      summary: Friend Email Gating
      tags:
      - Friend Email Gating
      parameters: []
      operationId: friend_email_gating
      responses:
        '200':
          description: Talkable considers a Webhook as "delivered successfully" when
            a site server returns a 2xx response status. Otherwise Talkable will continually
            retry to deliver a Webhook after a set interval of time.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Talkable security key
                site:
                  "$ref": "../schemas.yaml#/site_slug"
                type:
                  type: string
                  example: claim_signup_web_hook
                extras:
                  type: object
                  example: {}
                payload:
                  type: object
                  properties:
                    offer:
                      "$ref": "#components/schemas/offer"
                    campaign:
                      "$ref": "#components/schemas/campaign"
                    email:
                      "$ref": "#components/schemas/email"
                      description: Friend’s email address
                    phone_number:
                      "$ref": "../schemas.yaml#/phone_number"
                      description: Friend’s phone number (optional)
                    first_name:
                      type: string
                      example: John
                      description: Friend’s first name (optional)
                    last_name:
                      type: string
                      example: Doe
                      description: Friend’s last name (optional)
                    username:
                      type: string
                      example: johndoe1992
                      description: Friend’s username (optional)
                    unsubscribed_at:
                      "$ref": "../schemas.yaml#/date_time"
                      description: Date Friend has unsubscribed with phone number
                        (optional)
                    subscribed_at:
                      "$ref": "../schemas.yaml#/date_time"
                      description: Date Friend has subscribed (deprecated in favor
                        of ``opted_in_at``)
                    opted_in_at:
                      "$ref": "../schemas.yaml#/date_time"
                      description: Date Friend has subscribed (optional)
                    phone_opted_in_at:
                      "$ref": "../schemas.yaml#/date_time"
                      description: Date Friend has subscribed with email (optional)
                    is_loyalty_member:
                      type: boolean
                      example: true
                      description: Whether the Friend participates in loyalty program
                    loyalty_member:
                      type: object
                      example: {}
                      description: Details of the Friend as a loyalty program participant
                    custom_properties:
                      "$ref": "../schemas.yaml#/custom_properties"
                      description: Hash of Friend’s custom properties (optional)
                    gender:
                      type: string
                      description: "[deprecated]"
                    referral_counts:
                      type: object
                      description: Referral counts of Friend as Advocate
                      properties:
                        total:
                          type: integer
                          example: 2
                        approved:
                          type: integer
                          example: 1
                        pending:
                          type: integer
                          example: 1
                    sub_choice:
                      type: boolean
                      example: false
                      description: Subscription choice
                    ip_address:
                      "$ref": "../schemas.yaml#/ip_address"
                      description: Friend’s IP address
  "/your_api_create_coupon_web_hook_path":
    post:
      summary: Create Coupon
      tags:
      - Create Coupon
      parameters: []
      operationId: create_coupon
      responses:
        '200':
          description: Talkable considers a Webhook as "delivered successfully" when
            a site server returns a 2xx response status. Otherwise Talkable will continually
            retry to deliver a Webhook after a set interval of time.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Talkable security key
                site:
                  "$ref": "../schemas.yaml#/site_slug"
                type:
                  type: string
                  example: create_coupon_web_hook
                extras:
                  type: object
                  example: {}
                payload:
                  type: object
                  properties:
                    coupon_auto_sync_enabled:
                      type: boolean
                      description: Shopify Coupon auto-sync status. Note that the
                        webhook takes precedence over Shopify Coupon auto-sync
                    coupon_code:
                      type: string
                      description: Unique coupon code
                    coupon_list_id:
                      type: integer
                      description: ID of the coupon list that needs to be filled
                    coupon_list_name:
                      type: string
                      description: Name of the coupon list that needs to be filled
                    email:
                      "$ref": "#components/schemas/email"
                      description: Email of the Advocate. This field is only relevant
                        for personal coupons.
                    phone_number:
                      "$ref": "#components/schemas/phone_number"
                      description: Phone number of the Advocate. This field is only
                        relevant for personal coupons.
                    discount_amount:
                      type: string
                      example: '10.0'
                    percentage_discount:
                      type: boolean
                      description: When true percentage discount should be created,
                        otherwise fixed discount
                    usage_limit:
                      type: integer
                      description: Number of usages for the coupon
                    expires_at:
                      "$ref": "../schemas.yaml#/date_time"
                      description: Coupon expiration date
  "/your_api_event_web_hook_path":
    post:
      summary: Event
      tags:
      - Event
      parameters: []
      operationId: event
      responses:
        '200':
          description: Talkable considers a Webhook as "delivered successfully" when
            a site server returns a 2xx response status. Otherwise Talkable will continually
            retry to deliver a Webhook after a set interval of time.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Talkable security key
                site:
                  "$ref": "../schemas.yaml#/site_slug"
                type:
                  type: string
                  example: event_web_hook
                extras:
                  type: object
                  example: {}
                payload:
                  type: object
                  properties:
                    person:
                      "$ref": "#/components/schemas/person"
                      description: Object describing the person who triggered the
                        event
                    origin:
                      "$ref": "#/components/schemas/event"
                      description: Event data
  "/your_api_offer_signup_web_hook_path":
    post:
      summary: Advocate Signup
      tags:
      - Advocate Signup
      parameters: []
      operationId: advocate_signup
      responses:
        '200':
          description: Talkable considers a Webhook as "delivered successfully" when
            a site server returns a 2xx response status. Otherwise Talkable will continually
            retry to deliver a Webhook after a set interval of time.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Talkable security key
                site:
                  "$ref": "../schemas.yaml#/site_slug"
                type:
                  type: string
                  example: offer_signup_web_hook
                extras:
                  type: object
                  example: {}
                payload:
                  type: object
                  properties:
                    campaign:
                      "$ref": "#components/schemas/campaign"
                    offer:
                      "$ref": "#components/schemas/offer"
                    email:
                      "$ref": "#components/schemas/email"
                      description: Affiliate member’s email address
                    phone_number:
                      "$ref": "../schemas.yaml#/phone_number"
                      description: Affiliate member’s phone number (optional)
                    first_name:
                      type: string
                      example: John
                      description: Affiliate member’s first name (optional)
                    last_name:
                      type: string
                      example: Doe
                      description: Affiliate member’s last name (optional)
                    username:
                      type: string
                      example: johndoe1992
                      description: Affiliate member’s username (optional)
                    unsubscribed_at:
                      "$ref": "../schemas.yaml#/date_time"
                      description: Date Affiliate member has unsubscribed with phone
                        number (optional)
                    subscribed_at:
                      "$ref": "../schemas.yaml#/date_time"
                      description: Date Affiliate member has subscribed (deprecated
                        in favor of ``opted_in_at``)
                    opted_in_at:
                      "$ref": "../schemas.yaml#/date_time"
                      description: Date Affiliate member has subscribed (optional)
                    phone_opted_in_at:
                      "$ref": "../schemas.yaml#/date_time"
                      description: Date Affiliate member has subscribed with email
                        (optional)
                    is_loyalty_member:
                      type: boolean
                      example: true
                      description: Whether the Affiliate member participates in loyalty
                        program
                    loyalty_member:
                      type: object
                      example: {}
                      description: Details of the Affiliate member as a loyalty program
                        participant (optional)
                    custom_properties:
                      "$ref": "../schemas.yaml#/custom_properties"
                      description: Object of Affiliate member’s custom properties
                        (optional)
                    gender:
                      type: string
                      description: "[deprecated]"
                    referral_counts:
                      type: object
                      description: Referral counts of Affiliate member as Advocate
                      properties:
                        total:
                          type: integer
                          example: 2
                        approved:
                          type: integer
                          example: 1
                        pending:
                          type: integer
                          example: 1
                    sub_choice:
                      type: boolean
                      example: false
                      description: Subscription choice
  "/your_api_post_share_web_hook_path":
    post:
      summary: Post Share
      tags:
      - Post Share
      parameters: []
      operationId: post_share
      responses:
        '200':
          description: Talkable considers a Webhook as "delivered successfully" when
            a site server returns a 2xx response status. Otherwise Talkable will continually
            retry to deliver a Webhook after a set interval of time.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Talkable security key
                site:
                  "$ref": "../schemas.yaml#/site_slug"
                type:
                  type: string
                  example: post_share_web_hook
                extras:
                  type: object
                  example: {}
                payload:
                  type: object
                  properties:
                    campaign:
                      "$ref": "#components/schemas/campaign"
                    share_type:
                      type: string
                      enum:
                      - email
                      - facebook
                      - facebook_message
                      - facebook_sponsored
                      - twitter
                      - linkedin
                      - whatsapp
                      - sms
                      - other
                      example: facebook
                      description: "*Note*: custom share_types can be created"
                    share_info:
                      type: object
                      properties:
                        recipients:
                          type: array
                          items:
                            type: string
                          example:
                          - recipient1@b.com
                          - recipient2@b.com
                      description: |
                        * For Facebook share:

                          ``facebook_share_post_id`` — Facebook post ID

                          ``facebook_share_user_id`` — Facebook user ID

                        * For email share:

                          ``recipients`` — an array of email addresses
                    sharer_info:
                      "$ref": "#components/schemas/person"
                      description: Object describing the person who shared the offer
                    share_link:
                      type: string
                      description: Link sent in share message (optional, present only
                        for Facebook and X (formerly Twitter) shares)
                    origin:
                      "$ref": "#components/schemas/origin"
                      description: Contains data about the event that issued an offer
  "/your_api_referral_web_hook_path":
    post:
      summary: Referral
      tags:
      - Referral
      parameters: []
      operationId: referral
      responses:
        '200':
          description: Referral Webhook keeps retrying until it gets 2xx HTTP status
            in response. Only after that rewards associated with the referral can
            be paid.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Talkable security key
                site:
                  "$ref": "../schemas.yaml#/site_slug"
                type:
                  type: string
                  example: referral_web_hook
                extras:
                  type: object
                  example: {}
                payload:
                  type: object
                  properties:
                    campaign:
                      "$ref": "#components/schemas/campaign"
                    offer:
                      "$ref": "#components/schemas/offer"
                    advocate_rewards:
                      type: array
                      description: Array of objects describing the rewards received
                        by Advocate person (except for rewards paid in loyalty points)
                      items:
                        "$ref": "#/components/schemas/referral_reward"
                    friend_rewards:
                      type: array
                      items:
                        "$ref": "#/components/schemas/referral_reward"
                      description: Array of objects describing the rewards received
                        by Referred person (except for rewards paid in loyalty points)
                    referrer:
                      "$ref": "#/components/schemas/referral_reward"
                      description: Advocate referral incentive reward details (optional,
                        absent if reward was paid in loyalty points)
                    referred:
                      "$ref": "#/components/schemas/referral_reward"
                      description: Friend referred incentive reward details (optional,
                        absent if reward was paid in loyalty points)
                    referred_origin:
                      "$ref": "#/components/schemas/origin"
                      description: Object with referred origin made by Friend that
                        created a referral
                    share:
                      type: object
                      description: Details about share
                      properties:
                        channel:
                          type: string
                          example: email
                          description: Sharing channel involved in the referral
  "/your_api_reward_web_hook_path":
    post:
      summary: Reward
      tags:
      - Reward
      parameters: []
      operationId: reward
      responses:
        '200':
          description: Talkable considers a Webhook as "delivered successfully" when
            a site server returns a 2xx response status. Otherwise Talkable will continually
            retry to deliver a Webhook after a set interval of time.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Talkable security key
                site:
                  "$ref": "../schemas.yaml#/site_slug"
                type:
                  type: string
                  example: reward_web_hook
                extras:
                  type: object
                  example: {}
                payload:
                  type: object
                  properties:
                    campaign:
                      "$ref": "#components/schemas/campaign"
                    offer:
                      "$ref": "#components/schemas/offer"
                    person:
                      "$ref": "#components/schemas/person"
                      description: 'Object describing the person that got reward (note:
                        might be null)'
                    origin:
                      "$ref": "#components/schemas/origin"
                      description: Object of data related to the event that issued
                        an offer
                    reward:
                      type: object
                      description: Object of parameters describing the reward itself
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the reward
                        reason:
                          type: string
                          description: Reason why this reward was given
                        status:
                          type: string
                          description: Status of the reward (i.e. “Paid”, “Unpaid”,
                            “Voided”)
                        incentive_type:
                          type: string
                          description: Type of incentive (rebate, discount_coupon,
                            other)
                        incentive_identifier:
                          type: string
                          description: Unique human-readable identifier of the incentive
                        incentive_description:
                          type: string
                          description: Description of incentive (human-readable, equals
                            to non monetary description if ``incentive_type`` is ``other``)
                        incentive_custom_description:
                          type: string
                          description: Custom Description of incentive
                        amount:
                          type: number
                          format: float
                          description: Amount of money to reward (null when ``incentive_type``
                            is discount_coupon or other)
                        coupon_code:
                          type: string
                          description: Deprecated in favor of ``coupon``
                        coupon:
                          type: object
                          description: Reward coupon details (null when ``incentive_type``
                            is ``rebate`` or ``other``)
                          properties:
                            active:
                              type: boolean
                              description: "``true`` if the coupon has not expired
                                yet"
                            amount:
                              type: number
                              format: float
                              description: Amount of the discount that the coupon
                                provides
                            code:
                              type: string
                              description: Unique coupon code
                            description:
                              type: string
                              example: "$15"
                              description: Human-readable representation of the discount
                                (e.g. “$15” or “10%”)
                            id:
                              type: integer
                              description: Unique identifier of the coupon
                            percentage_discount:
                              type: boolean
                              description: "``true`` if the coupon amount is percentage
                                as opposed to a fixed value"
                            single_use:
                              type: boolean
                              description: "``true`` if the coupon is single-use"
                            usages:
                              type: integer
                              description: Number of times the coupon has been used
                                (null if the coupon is multi-use)
                            used:
                              type: boolean
                              description: "``true`` if the coupon has been used"
                            expires_at:
                              "$ref": "../schemas.yaml#/date_time"
                              description: Expiration time of the coupon (deprecated
                                in favor of ``valid_until``)
                            valid_until:
                              "$ref": "../schemas.yaml#/date_time"
                              description: Expiration time of the coupon in the site
                                time zone
                    advocate_origin:
                      "$ref": "#components/schemas/origin"
                      description: Object of data related to the Advocate origin
                    friend_origin:
                      "$ref": "#components/schemas/origin"
                      description: Object of data related to the Friend origin
  "/your_api_unsubscribe_web_hook_path":
    post:
      summary: Unsubscribe
      tags:
      - Unsubscribe
      parameters: []
      operationId: unsubscribe
      responses:
        '200':
          description: Talkable considers a Webhook as "delivered successfully" when
            a site server returns a 2xx response status. Otherwise Talkable will continually
            retry to deliver a Webhook after a set interval of time.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Talkable security key
                site:
                  "$ref": "../schemas.yaml#/site_slug"
                type:
                  type: string
                  example: unsubscribe_web_hook
                extras:
                  type: object
                  example: {}
                payload:
                  type: object
                  properties:
                    person:
                      "$ref": "#components/schemas/person"
servers:
- url: https://www.talkable.com
info:
  title: Webhooks
  version: '1.0'
  contact:
    name: Webhooks
    url: https://docs.talkable.com/web_hooks/
tags:
- name: Create Coupon
- name: Advocate Signup
- name: Friend Email Gating
- name: Post Share
- name: Event
- name: Referral
- name: Reward
- name: Unsubscribe
- name: Check Unsubscribe
components:
  schemas:
    campaign:
      type: object
      description: Object describing the campaign
      properties:
        id:
          type: integer
          example: 123
        type:
          type: string
          example: StandaloneCampaign
          enum:
          - StandaloneCampaign
          - DoubleSidedDealCampaign
          description: "[deprecated]"
        cached_slug:
          type: integer
          example: 123
          description: Same as ``id``, SEO friendly
        tag_names:
          type: array
          items:
            type: string
          example:
          - default
        joinable_category_names:
          type: array
          items:
            type: string
          example:
          - affiliate_member
          description: "[deprecated] Categories of origins that trigger the campaign"
        origin_min_age:
          type: integer
          example: 15
          description: Seconds passed since the first site visit before the Advocate
            can see the campaign
        origin_max_age:
          type: integer
          example: 30
          description: Seconds passed since the first site visit during which the
            Advocate can see the campaign
    offer:
      type: object
      description: Object describing the offer
      properties:
        email:
          "$ref": "#/components/schemas/email"
          description: Advocate’s email address
        phone_number:
          "$ref": "#/components/schemas/phone_number"
          description: Advocate's phone number in e164 format
        short_url_code:
          type: string
          example: 1a2PV
          description: Unique offer ID
        ip_address:
          "$ref": "../schemas.yaml#/ip_address"
    person:
      type: object
      properties:
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        email:
          "$ref": "#/components/schemas/email"
        phone_number:
          "$ref": "../schemas.yaml#/phone_number"
        username:
          type: string
          example: johndoe1992
        customer_id:
          type: string
          example: '1024'
        unsubscribed_at:
          "$ref": "../schemas.yaml#/date_time"
        subscribed_at:
          "$ref": "../schemas.yaml#/date_time"
          description: Date person has subscribed (deprecated in favor of ``opted_in_at``)
        opted_in_at:
          "$ref": "../schemas.yaml#/date_time"
          description: Date person has subscribed
        phone_opted_in_at:
          "$ref": "../schemas.yaml#/date_time"
        is_loyalty_member:
          type: boolean
          example: true
        loyalty_member:
          type: object
          example: {}
        custom_properties:
          "$ref": "../schemas.yaml#/custom_properties"
        gender:
          type: string
          description: "[deprecated]"
        referral_counts:
          type: object
          description: Referral counts of person as Advocate
          properties:
            total:
              type: integer
              example: 2
            approved:
              type: integer
              example: 1
            pending:
              type: integer
              example: 1
        sub_choice:
          type: boolean
          example: false
          description: Subscription choice
    generic_origin:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the origin event in Talkable
          example: 1234
        email:
          "$ref": "#/components/schemas/email"
          description: Email address of the person
        phone_number:
          "$ref": "#/components/schemas/phone_number"
          description: Phone number of the person
        customer_id:
          type: string
          example: AB1234
          description: Unique external identifier of a customer who triggered the
            origin event
        traffic_source:
          type: string
          example: post-checkout
          description: Traffic source of the origin event
        ip_address:
          "$ref": "../schemas.yaml#/ip_address"
          description: IP address of the origin event
        subtotal:
          type: number
          format: float
          description: Monetary attribute (for Purchase and Event)
        coupon_code:
          type: string
          description: Coupon codes used with the Purchase or Event (separated by
            ``,`` if multiple) (for Purchase only)
        segment1:
          type: string
          description: Value for segment1
        segment2:
          type: string
          description: Value for segment2
        segment3:
          type: string
          description: Value for segment3
        utm_campaign:
          type: string
          description: Value for utm_campaign
        utm_content:
          type: string
          description: Value for utm_content
        utm_medium:
          type: string
          description: Value for utm_medium
        utm_source:
          type: string
          description: Value for utm_source
        utm_term:
          type: string
          description: Value for utm_term
    event:
      allOf:
      - "$ref": "#/components/schemas/generic_origin"
      - description: Event data
        properties:
          currency_iso_code:
            type: string
            description: Currency ISO code
            example: USD
          type:
            type: string
            enum:
            - AffiliateMember
            - Purchase
            - Event
            example: Event
          event_category:
            type: string
            example: app_installed
            description: Identifier of an action that trigger the Event (for Event
              only)
          event_number:
            type: string
            description: Unique identifier of the Event within the associated event_category
              (for Event only)
            example: subscription_12345
    origin:
      type: object
      properties:
        type:
          type: string
          enum:
          - AffiliateMember
          - Purchase
          - Event
          example: Purchase
          description: |
            *Purchase* for post-purchase placement

            *AffiliateMember* for standalone, floating widget, or gleam placements

            *Event* for post-event placement (such as a signup/share page which triggers a referral campaign)
        id:
          type: integer
          description: Unique identifier of the origin event
          example: 1234
        email:
          "$ref": "#/components/schemas/email"
          description: Email address of the person
        phone_number:
          "$ref": "#/components/schemas/phone_number"
          description: Phone number of the person
        customer_id:
          type: string
          example: AB1234
          description: Unique external identifier of a customer who triggered the
            origin event
        traffic_source:
          type: string
          example: post-checkout
          description: Traffic source of the origin event
        ip_address:
          "$ref": "../schemas.yaml#/ip_address"
          description: IP address of the origin event
        order_number:
          type: string
          description: Unique identifier of the Purchase (for Purchase only)
          example: '11111'
        order_date:
          "$ref": "../schemas.yaml#/date_time"
          description: Date of the Purchase (for Purchase only)
        subtotal:
          type: number
          format: float
          description: Monetary attribute (for Purchase and Event)
        currency_iso_code:
          type: string
          description: Currency code of the Purchase or Event, defaults to the Site’s
            currency (for Purchase only)
          example: USD
        coupon_code:
          type: string
          description: Coupon codes used with the Purchase or Event (separated by
            ``,`` if multiple) (for Purchase only)
        event_category:
          type: string
          example: app_installed
          description: Identifier of an action that trigger the Event (for Event only)
        event_number:
          type: string
          description: Unique identifier of the Event within the associated event_category
            (for Event only)
        segment1:
          type: string
          description: Value for segment1
        segment2:
          type: string
          description: Value for segment2
        segment3:
          type: string
          description: Value for segment3
        utm_campaign:
          type: string
          description: Value for utm_campaign
        utm_content:
          type: string
          description: Value for utm_content
        utm_medium:
          type: string
          description: Value for utm_medium
        utm_source:
          type: string
          description: Value for utm_source
        utm_term:
          type: string
          description: Value for utm_term
    referral_reward:
      type: object
      properties:
        id:
          type: integer
          description: Unique reward ID
        amount:
          type: string
          example: '10.0'
          description: Amount of money to reward (null when non-monetary incentive
            is used)
        email:
          "$ref": "#/components/schemas/email"
          description: Email of the person who got reward
        person:
          "$ref": "#/components/schemas/person"
          description: Parameters describing the person who got reward
        incentive:
          type: string
          enum:
          - rebate
          - discount_coupon
          - other
          example: rebate
          description: |
            Type of incentive reward

            *Rebate* (``rebate``) — monetary reward, certain amount of money that should be paid out to a customer with a given email. The merchants’ payment system should handle the payment.

            *Coupon code* (``discount_coupon``) — a discount coupon is issued to user. Talkable handles distributing this type of incentives.

            *Non-monetary* (``other``) — used when a campaign has a non-monetary rebate like “Free T-shirt” or “One Month Free”. This should be handled on the merchant’s side. More information on the reward is specified in incentive_description.
        incentive_description:
          type: string
          description: Verbose reward explanation
        reward_coupon_code:
          type: string
          description: Coupon code received by person as a reward (present if incentive
            equals ``discount_coupon``)
        origin:
          "$ref": "#/components/schemas/origin"
          description: Contains data about the event that issued the reward
    email:
      type: string
      format: email
      example: user@store.com
    phone_number:
      type: string
      example: "+12025551111"
