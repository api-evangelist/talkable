notes: Customer-facing, account-scoped MCP server. An agent acts as the signed-in user and is gated by
  both the credential scope (mcp:read / mcp:write) and the user's Talkable role on each site (Admin /
  Write / CSP / Read). Exposes the same tools as the Talkable AI Assistant.
