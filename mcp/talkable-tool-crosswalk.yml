divergence_summary: >-
  The two surfaces are near-complements, not projections of one another. MCP is a
  reporting-and-support console (campaign config, split tests, report exports,
  site settings, referral/person/coupon lookups) — 17 of its 24 tools have no REST
  operation at all. REST is an ingestion-and-fulfilment API (origins, purchases,
  events, loyalty ledger, offer sharing, assets) — 35 of its 44 operations have no
  tool. Only 7 tools bind cleanly to REST. An agent limited to MCP cannot register
  a purchase or move a loyalty balance; an integration limited to REST cannot read
  a metric catalog or approve a referral by id.
