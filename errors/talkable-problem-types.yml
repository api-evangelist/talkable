docs: https://docs.talkable.com/api_v2/intro/
format: envelope
envelope:
  shape: '{ "ok": false, "error_message": "..." }'
  field: error_message
  note: >-
    Talkable does not use RFC 9457 application/problem+json. Errors are returned
    in the standard ok/error_message envelope with a standard HTTP status code.
    Most error messages are not meant to be shown to end users.
problems:
  - status: 400
    title: Bad Request
    meaning: Often a missing required parameter.
    action: Check required parameters (e.g. site_slug) and request body shape.
  - status: 401
    title: Unauthorized
    meaning: No valid API key provided.
    action: Provide a valid Bearer API key in the Authorization header.
  - status: 404
    title: Not Found
    meaning: The requested item does not exist.
    action: Verify the resource identifier (person_slug, coupon code, offer short_url_code, etc.).
  - status: 422
    title: Unprocessable Entity
    meaning: The request was well-formed but could not be processed (validation failed).
    action: Inspect error_message and correct the submitted values.
  - status: 429
    title: Too Many Requests
    meaning: >-
      The site is being throttled. Talkable computes resource consumption per site
      across all integrations (REST, JavaScript library, mobile SDKs) and throttles
      when consumption rises unexpectedly.
    action: >-
      Retry with incremental backoff in the realm of seconds and up to minutes.
      Consecutive calls may keep returning 429 until server load drops. No
      Retry-After or RateLimit-* header is returned.
    ref: rate-limits/talkable-rate-limits.yml
  - status: 500
    title: Internal Server Error
    meaning: Something is wrong on Talkable's end.
    action: Retry; escalate to Talkable support if persistent. Check https://status.talkable.com/.
  - status: 502
    title: Bad Gateway
    meaning: Server error on Talkable's end.
    action: Retry with backoff.
  - status: 503
    title: Service Unavailable
    meaning: Server error on Talkable's end.
    action: Retry with backoff; check https://status.talkable.com/.
  - status: 504
    title: Gateway Timeout
    meaning: Server error on Talkable's end.
    action: Retry with backoff.
