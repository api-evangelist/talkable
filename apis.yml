aid: talkable
name: Talkable
description: >-
  Talkable is a referral marketing and loyalty platform that helps e-commerce and
  subscription brands acquire and retain customers through referral programs, loyalty
  campaigns, and advocacy incentives. It provides a RESTful JSON API (v2) for origins
  (off-site purchase and event ingestion), offers and shares, referrals, people, coupons,
  loyalty members, metrics, assets, and traffic sources; native iOS and Android SDKs plus
  an official Ruby gem; a nine-event webhook surface; and a customer-facing hosted MCP
  server that lets AI agents operate a Talkable program over the Model Context Protocol
  using OAuth 2.1 or API keys. Talkable is backed by 500 Global.
url: https://raw.githubusercontent.com/api-evangelist/talkable/refs/heads/main/apis.yml
x-type: company
x-source: vc-portfolio
x-backed-by:
- 500-global
accessModel:
  pricing: unknown
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Self-serve signup
  confidence: medium
  source:
